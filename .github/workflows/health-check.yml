name: Health Check

on:
  schedule:
    # Every 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger health check
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          STATUS_PAGE_URL: ${{ secrets.STATUS_PAGE_URL }}
        run: |
          curl --fail --show-error --max-time 60 -X GET \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$STATUS_PAGE_URL/api/cron"
